<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Alexandre Torres — OSS Assurance Expert</title>
  <desc id="desc">AT brand mark and a service-assurance signal path moving from observation to improvement.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.58" stop-color="#0a2335"/>
      <stop offset="1" stop-color="#103c51"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46d7c7"/>
      <stop offset="0.55" stop-color="#64b5f6"/>
      <stop offset="1" stop-color="#9cc7ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#46d7c7" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#46d7c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a6c7dc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#background)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1095" cy="170" r="250" fill="url(#glow)"/>

  <g transform="translate(52 54) scale(.34)">
    <path fill="#f4f8fb" d="M14 272 129 34 188 35 301 272 232 272 157 112 81 272Z"/>
    <path fill="#46d7c7" d="M208 34H432V93H368V272H302V93H237Z"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="220" y="82" fill="#7ce7dc" font-size="13" font-weight="700" letter-spacing="2.1">SERVICE ASSURANCE · OPERATIONS · AUTOMATION</text>
    <text x="218" y="151" fill="#f4f8fb" font-size="52" font-weight="700" letter-spacing="0.3">Alexandre Torres</text>
    <text x="220" y="194" fill="#b8cfdd" font-size="24" font-weight="500">OSS Assurance Expert</text>
    <text x="220" y="264" fill="#e1edf4" font-size="19" font-weight="700" letter-spacing="0.8">SIGNALS  →  INSIGHT  →  ACTION  →  RELIABILITY</text>
    <rect x="220" y="287" width="410" height="3" rx="1.5" fill="url(#signal)"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 760 219 L 808 219 L 836 148 L 878 274 L 916 111 L 950 219 L 993 219"
          stroke="#294f65" stroke-width="12" opacity="0.45"/>
    <path d="M 760 219 L 808 219 L 836 148 L 878 274 L 916 111 L 950 219 L 993 219"
          stroke="url(#signal)" stroke-width="4" filter="url(#softGlow)"/>
    <path d="M 993 219 C 1038 219 1043 152 1088 152 C 1133 152 1139 219 1183 219"
          stroke="#64b5f6" stroke-width="4" opacity="0.9"/>
  </g>

  <g fill="#07131f" stroke="#7ce7dc" stroke-width="3">
    <circle cx="760" cy="219" r="9"/>
    <circle cx="993" cy="219" r="9"/>
    <circle cx="1183" cy="219" r="9"/>
  </g>
  <g fill="#cbeef2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
    <text x="760" y="246" text-anchor="middle">OBSERVE</text>
    <text x="993" y="246" text-anchor="middle">ASSURE</text>
    <text x="1183" y="246" text-anchor="middle">IMPROVE</text>
  </g>
</svg>
